services:
    nopcommerce_web:
        build: .
        container_name: nopcommerce
        restart: unless-stopped
        ports:
            - "8080:80"
        depends_on:
            nopcommerce_database:
                condition: service_healthy
        volumes:
            - nopcommerce_app_data:/app/App_Data
    nopcommerce_database:
        image: "mcr.microsoft.com/mssql/server:2019-latest"
        container_name: nopcommerce_mssql_server
        restart: unless-stopped
        environment:
            MSSQL_SA_PASSWORD: "nopCommerce_db_password"
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Express"
        volumes:
            - nopcommerce_data:/var/opt/mssql
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

volumes:
  nopcommerce_app_data:
  nopcommerce_data:
